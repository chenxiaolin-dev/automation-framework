[pytest]
addopts = -ra
testpaths = projects tests
markers =
    api: 接口自动化用例
    web_ui: Web UI 自动化用例（Playwright）
    app: APP 自动化用例（Appium）
    mini_program: 小程序自动化用例（Minium）
    p0: 优先级 P0
    p1: 优先级 P1
    p2: 优先级 P2
    smoke: 冒烟用例
    regression: 回归用例
    negative: 负向（异常）用例
    boundary: 边界值用例
    crud: 业务 CRUD 依赖链用例
    serial: 依赖链用例，禁止并发执行
    cleanup: 链路最后一步，负责清理造数
