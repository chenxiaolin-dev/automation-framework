    extract: {address_id: json.data}
  request: {method: GET, path: "/address/detail/${address_id}"}
  validate:
  - {check: status_code, assert: eq, expect: 200}
  - {check: json.code, assert: eq, expect: 0}
  - {check: json.data, assert: not_empty}
  teardown:
  - action: request
